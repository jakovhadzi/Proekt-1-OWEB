<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="style/login.css">
    </head>
    <body class="d-flex align-items-center min-vh-100">
        <div class="container py-5 my-3 border border-dark bg-dark text-light log-in-box">
            <div class="row py-5 mx-2">
                <h2 class="col-6 mx-3">Forgot password</h2>
                <form class="col-5">
                    <div class="form-group">
                        <label for="inputEmail">Get a verification code</label>
                        <input class="form-control border-light bg-dark rounded text-light" id="inputEmail" type="email" placeholder="Email" required>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button id="getCodeButton" type="submit" class="btn btn-light">Get code</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
