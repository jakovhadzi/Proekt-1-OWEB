<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="style/login.css">
        <link rel="icon" href="travel.png">
    </head>
    <body class="d-flex align-items-center min-vh-100">
        <div class="container py-5 my-3 border border-dark bg-dark text-light log-in-box">
            <div class="row py-5 mx-2">
                <h2 class="col-6 mx-3">Sign in</h2>
                <form class="col-5">
                    <div class="form-group">
                        <input id="loginEmail" class="form-control border-light bg-dark rounded text-light" type="email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input id="loginPass" class="form-control border-light bg-dark rounded text-light" type="password" placeholder="Password" required>
                    </div>
                    <div class="error-slot">
                        <div id="loginError" class="alert alert-danger mb-0 py-2 d-none"></div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a href="./signup.html" class="btn btn-dark">Create account</a>
                        <button id="loginButton" type="submit" class="btn btn-light ml-1">Sign in</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="javaScript/users.js"></script>
        <script src="javaScript/login.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
