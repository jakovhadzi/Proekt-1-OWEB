<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign up</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="style/login.css">
        <link rel="icon" href="travel.png">
    </head>
    <body class="d-flex align-items-center min-vh-100">
        <div class="container py-5 my-3 border border-dark bg-dark text-light log-in-box">
            <div class="row py-5 mx-2">
                <h2 class="col-6 mx-3">Create a Travel Planner<br>Account</h2>
                <form class="col-5">
                    <div class="form-group">
                        <input class="form-control border-light bg-dark rounded text-light my-1" id="signupEmail" type="email" placeholder="Email" required>
                        <input class="form-control border-light bg-dark rounded text-light my-1" id="signupUser" type="text" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <input class="form-control border-light bg-dark rounded text-light my-1" id="signupPass" type="password" placeholder="Create password" required>
                        <input class="form-control border-light bg-dark rounded text-light my-1" id="signupPassCopy" type="password" placeholder="Repeat password" required>
                        <div class="error-slot">
                        <div id="signupError" class="alert alert-danger mb-0 py-2 d-none"></div>
                    </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button id="createAccountButton" type="submit" class="btn btn-light">Create account</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="javaScript/users.js"></script>
        <script src="javaScript/signup.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
